# XcodeGen spec — `xcodegen` here produces InklessPocket.xcodeproj (gitignored, regenerate after adding a file).
name: InklessPocket
options:
  bundleIdPrefix: com.example            # change to your own
  deploymentTarget:
    iOS: "17.0"
packages:
  InklessKit:
    path: InklessKit
targets:
  InklessPocket:
    type: application
    platform: iOS
    sources: [App/Sources, App/Assets.xcassets]
    dependencies:
      - package: InklessKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Inkless Pocket
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: Inkless Pocket prints over Bluetooth to the pocket printer. Nothing else uses the radio.
        UIBackgroundModes: [bluetooth-central]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"     # Xcode's default is empty
        PRODUCT_BUNDLE_IDENTIFIER: com.example.InklessPocket
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""     # your Apple team ID
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
